[project]
name = "tennis-data"
version = "0.1.0"
description = "Reproducible, validated historical ATP singles match dataset (data foundation for leakage-free tennis prediction)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Code: MIT. Data: CC BY-NC-SA 4.0 (Jeff Sackmann), see README." }
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "numpy>=1.26",
]

[project.scripts]
tennis-data = "tennis_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_data"]

[dependency-groups]
dashboard = [
    "plotly>=5.24",
    "streamlit>=1.40",
]
dev = [
    "pytest>=8",
    "scipy>=1.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E9", "I", "UP", "B"]
